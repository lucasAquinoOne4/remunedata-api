# Nginx do host (EC2). Versão FINAL, já com TLS (Let's Encrypt, domínio remunedata.serveblog.net).
# Primeira instalação: suba com um bloco `listen 80` simples, rode
#   certbot --nginx -d remunedata.serveblog.net --non-interactive --agree-tos \
#           --register-unsafely-without-email --redirect
# e depois substitua por este arquivo. Teste sempre com `nginx -t` antes do reload.

# Limite por IP: 10 req/s com rajada de 20 nas rotas da API (a API também tem RateLimiter)
limit_req_zone $binary_remote_addr zone=remune_api:10m rate=10r/s;
limit_req_status 429;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name remunedata.serveblog.net _;
  server_tokens off;

  location / {
    return 301 https://remunedata.serveblog.net$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name remunedata.serveblog.net;
  server_tokens off;
  client_max_body_size 5m;

  ssl_certificate /etc/letsencrypt/live/remunedata.serveblog.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/remunedata.serveblog.net/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Cabeçalhos de segurança
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  root /var/www/remunedata;
  index index.html;

  # API e página estática servida pelo backend. /docs e /openapi.json NÃO são expostos.
  location ~ ^/(api|health|dashboard)(/|$) {
    limit_req zone=remune_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Não repassa X-Forwarded-For do cliente (forjável): o limitador da API usa este valor
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # add_header em location substitui os do server: repete os de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  # SPA (Vue Router em modo history)
  location / {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri $uri/ /index.html;
  }
}
